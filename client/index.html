<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WarZombie</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f14; font-family: system-ui, sans-serif; color: #e6edf3; }
      #game { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      /* cursores: mira sobre o jogo, seta estilizada na UI */
      #game { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><g fill='none' stroke='#0b0f14' stroke-width='4' stroke-linecap='round'><circle cx='18' cy='18' r='9'/><path d='M18 3v7M18 26v7M3 18h7M26 18h7'/></g><g fill='none' stroke='#ffd34d' stroke-width='2' stroke-linecap='round'><circle cx='18' cy='18' r='9'/><path d='M18 3v7M18 26v7M3 18h7M26 18h7'/></g><circle cx='18' cy='18' r='1.8' fill='#ff3b3b'/></svg>") 18 18, crosshair; }
      #ui, #ui * { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M4 2 L4 22 L9.5 17 L13.5 25 L17 23.5 L13 15.5 L20 15 Z' fill='#f3f5f7' stroke='#0b0f14' stroke-width='2' stroke-linejoin='round'/></svg>") 4 2, auto; }
      #ui button, #ui .slot, #ui a, #ui label, #ui input[type=radio] { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M4 2 L4 22 L9.5 17 L13.5 25 L17 23.5 L13 15.5 L20 15 Z' fill='#f3f5f7' stroke='#0b0f14' stroke-width='2' stroke-linejoin='round'/></svg>") 4 2, pointer; }

      .bar { height: 14px; background: #1c232c; border: 1px solid #2d3742; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
      .bar > div { height: 100%; transition: width .15s; }
      .hud-vitals { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 10px; }
      .ring { position: relative; width: 64px; height: 64px; }
      .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ring .track { fill: rgba(12,16,20,.75); stroke: #2d3742; stroke-width: 5; }
      .ring .fill { fill: none; stroke-width: 5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .15s; }
      .ring.hp .fill { stroke: #d63d3d; }
      .ring.stamina .fill { stroke: #3da0d6; }
      .ring.weight .fill { stroke: #c9a06a; }
      .hud-vitals.heavy .ring.weight .fill { stroke: #ff9f43; }
      .ring .icon { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -58%); fill: #e6edf3; }
      .ring .value { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 10px; font-weight: 700; color: #e6edf3; }
      .hud-vitals.low-hp .ring.hp .fill { stroke: #ff5a4d; animation: pulse .8s infinite; }
      @keyframes pulse { 50% { opacity: .4; } }

      .hotbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; }
      .hotbar .slot { cursor: pointer; }
      .slot { width: 52px; height: 52px; background: rgba(20,26,33,.85); border: 2px solid #2d3742; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; position: relative; }
      .item-icon { display: inline-block; background-color: var(--c); -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; flex-shrink: 0; }
      .slot .icon { width: 24px; height: 24px; margin-bottom: 3px; }
      .shop-icon { vertical-align: middle; margin-right: 8px; }
      .slot .count { position: absolute; right: 4px; bottom: 2px; font-size: 11px; font-weight: bold; }
      .slot .slot-number { position: absolute; left: 4px; top: 2px; font-size: 10px; color: #6b7681; font-weight: bold; }
      .slot.equipped { border-color: #ffd34d; box-shadow: 0 0 0 1px #ffd34d, 0 0 8px rgba(255,211,77,.5); }
      .slot.equipped .slot-number { color: #ffd34d; }

      .prompt { position: absolute; left: 50%; top: 60%; transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 6px 12px; border-radius: 6px; font-size: 14px; display: none; }
      .prompt.visible { display: block; }
      #ui.shop-open .prompt { display: none; }

      .inventory-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 420px; background: rgba(12,16,20,.95); border: 1px solid #2d3742; border-radius: 10px; padding: 16px; display: none; }
      .inventory-panel.visible { display: block; }
      .inventory-panel h2 { font-size: 16px; margin-bottom: 10px; }
      .inventory-panel .close { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; background: #2a323b; color: #e6edf3; border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; }
      .inventory-panel .close:hover { background: #d63d3d; }
      .inventory-panel .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 14px; }
      .inventory-panel .recipes { display: flex; flex-direction: column; gap: 6px; }
      .recipe { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 6px; background: #151b22; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
      .recipe button { background: #3a8f4a; border: 0; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
      .recipe button:disabled { background: #2a323b; color: #6b7681; cursor: not-allowed; }
      .recipe .recipe-label { flex: 1 1 auto; }
      .recipe .progress-bar { display: none; flex-basis: 100%; height: 8px; background: #0d1116; border-radius: 4px; overflow: hidden; }
      .recipe .progress-bar.visible { display: block; }
      .recipe .progress-fill { height: 100%; width: 0%; background: #3a8f4a; transition: width .2s linear; }

      .workbench-panel .wood-count { font-size: 13px; font-weight: 600; color: #c9a06a; margin-bottom: 12px; }

      #minimap { position: absolute; right: 16px; top: 16px; width: 160px; height: 160px; background: rgba(12,16,20,.8); border: 1px solid #2d3742; border-radius: 6px; }

      .hud-status { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(12,16,20,.85); border: 1px solid #2d3742; border-radius: 6px; padding: 6px 12px; font-size: 13px; display: none; }
      .hud-status.visible { display: block; }
      .hud-status .shield { color: #4db8ff; font-weight: 700; }
      .hud-status .slowed { color: #c05cff; font-weight: 700; }
      .slot { overflow: visible; }
      .slot .ammo-ring { position: absolute; inset: -4px; border-radius: 9px; z-index: -1; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
      .slot .ammo-count { position: absolute; left: 50%; top: -18px; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: #7ed957; white-space: nowrap; }
      .summary-panel h2 { text-align: center; letter-spacing: 4px; color: #7ed957; }
      .summary-panel .sub { text-align: center; color: #8b98a5; margin-bottom: 12px; }
      .summary-panel .sub b { color: #ffd34d; }
      table.summary { width: 100%; border-collapse: collapse; font-size: 14px; }
      table.summary th { text-align: left; color: #8b98a5; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #2d3742; }
      table.summary td { padding: 6px 8px; border-bottom: 1px solid #1c232c; }
      table.summary tr.me td { color: #ffd34d; }
      .hud-zombies { position: absolute; left: 16px; top: 16px; background: rgba(12,16,20,.8); border: 1px solid #2d3742; border-radius: 6px; padding: 8px 12px; font-size: 13px; line-height: 1.6; }
      .hud-zombies b { color: #7ed957; }
      .hud-zombies .kills { color: #ffd34d; }
      .hud-cooldown { color: #6b7681; font-size: 12px; }
      .hud-zombies .slowed { color: #c05cff; font-weight: 700; }
      .hud-zombies .shield { color: #4db8ff; font-weight: 700; }
      .damage-flash { position: absolute; inset: 0; background: rgba(214,61,61,.35); opacity: 0; pointer-events: none !important; transition: opacity .35s ease; }
      .damage-flash.visible { opacity: 1; transition: opacity .05s; }
      .death-screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,8,11,.85); }
      .death-screen.visible { display: flex; }
      .death-screen h1 { font-size: 48px; letter-spacing: 6px; color: #d63d3d; margin-bottom: 12px; }
      .death-screen p { color: #8b98a5; margin-bottom: 24px; }
      .death-screen button { font-size: 18px; padding: 12px 40px; background: #d63d3d; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }

      .toast-stack { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column-reverse; gap: 8px; align-items: flex-end; }
      .toast { display: flex; align-items: center; gap: 8px; background: rgba(18,24,30,.92); border: 1px solid #2d3742; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateX(16px); transition: opacity .2s ease, transform .2s ease; }
      .toast.visible { opacity: 1; transform: translateX(0); }
      .toast-icon { width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; }
      .toast .item-icon.toast-icon { border-radius: 0; }

      .menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(5,8,11,.72) 0%, rgba(5,8,11,.25) 35%, rgba(5,8,11,.35) 65%, rgba(5,8,11,.85) 100%); }
      .menu h1, .menu > p { text-shadow: 0 2px 12px rgba(0,0,0,.9), 0 0 2px #000; }
      .menu h1 { color: #f3f5f7; }
      .menu > p { color: #c9d1d9; }
      .menu h1 { font-size: 56px; letter-spacing: 6px; margin-bottom: 8px; }
      .menu p { color: #8b98a5; margin-bottom: 28px; }
      .menu button { font-size: 18px; padding: 12px 40px; background: #d63d3d; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
      .menu .mp { color: #7ed957; font-weight: 600; }
      .menu form.join { display: flex; gap: 8px; }
      .menu input { font-size: 18px; padding: 12px 16px; width: 240px; background: #0f151c; color: #e6edf3; border: 1px solid #2d3742; border-radius: 8px; outline: none; }
      .menu input:focus { border-color: #d63d3d; }
      .menu input:disabled, .menu button:disabled { opacity: .6; cursor: not-allowed; }
      .menu .status { min-height: 22px; margin-top: 12px; font-size: 14px; color: #8b98a5; }
      .menu .status.error { color: #ff7b7b; }
      .music-toggle { position: absolute; right: 18px; bottom: 18px; z-index: 7; font-size: 13px; padding: 8px 14px; background: rgba(12,16,20,.8); color: #e6edf3; border: 1px solid rgba(90,104,120,.6); border-radius: 999px; backdrop-filter: blur(6px); }
      .music-toggle:hover { border-color: #ffd34d; }
      .music-toggle.paused { color: #8b98a5; }
      .game-menu { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 300px; background: rgba(12,16,20,.95); border: 1px solid #2d3742; border-radius: 10px; padding: 18px 20px; font-size: 15px; line-height: 1.8; display: none; flex-direction: column; z-index: 6; }
      .game-menu.visible { display: flex; }
      .game-menu h2 { font-size: 18px; letter-spacing: 4px; margin-bottom: 6px; }
      .game-menu h3 { font-size: 11px; letter-spacing: 2px; color: #8b98a5; text-transform: uppercase; margin-top: 8px; }
      .game-menu .stats { list-style: none; font-size: 13px; line-height: 1.7; }
      .game-menu .stats li { display: flex; gap: 6px; align-items: baseline; }
      .game-menu .stats b { color: #e6edf3; }
      .game-menu .stats .lvl { margin-left: auto; color: #ffd34d; font-size: 11px; }
      .game-menu b { color: #ffd34d; }
      .game-menu .count { color: #7ed957; font-weight: bold; }
      .game-menu button { margin-top: 8px; font-size: 15px; padding: 10px; border: 0; border-radius: 6px; cursor: pointer; color: #e6edf3; background: #2a323b; }
      .game-menu button.resume { background: #3a8f4a; }
      .game-menu button.leave:hover { background: #d63d3d; }
      .name-labels { position: absolute; inset: 0; pointer-events: none !important; overflow: hidden; }
      .name-label { position: absolute; left: 0; top: 0; background: rgba(12,16,20,.75); color: #9fc2ff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
      .disconnect-banner { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); background: #d63d3d; color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 10; }
      .menu.lobby h1 { font-size: 40px; }
      .menu.lobby .rtitle { font-size: 32px; letter-spacing: 3px; }
      .lobby-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; width: min(760px, 92vw); margin-top: 8px; }
      .panel.ranking { grid-column: 1 / -1; }
      .rank-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .rank-cols h4 { font-size: 13px; color: #ffd34d; margin-bottom: 6px; }
      .rank-cols ol { list-style: none; display: flex; flex-direction: column; gap: 3px; max-height: 200px; overflow-y: auto; padding-right: 4px; }
      .rank-cols li .pos { width: 26px; text-align: center; font-weight: 700; color: #8b98a5; font-size: 12px; }
      .rank-cols li:nth-child(1) .pos, .rank-cols li:nth-child(2) .pos, .rank-cols li:nth-child(3) .pos { font-size: 15px; }
      .rank-cols li:nth-child(1) { background: linear-gradient(90deg, rgba(255,211,77,.18), transparent); }
      .rank-cols li { display: flex; align-items: center; gap: 8px; font-size: 13px; background: rgba(21,27,34,.6); padding: 4px 6px; border-radius: 6px; }
      .rank-cols li .rname { flex: 1; font-weight: 500; }
      .rank-cols li.me .rname { color: #ffd34d; }
      .rank-cols li.empty { color: #6b7681; list-style: none; }
      .panel { background: rgba(8,12,16,.74); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(90,104,120,.45); border-radius: 12px; padding: 14px 16px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
      .panel h2 { font-size: 15px; margin-bottom: 10px; color: #8b98a5; text-transform: uppercase; letter-spacing: 1px; }
      .panel ul { list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
      .panel li { display: flex; align-items: center; gap: 8px; background: rgba(21,27,34,.8); padding: 8px 10px; border-radius: 6px; font-size: 14px; }
      .panel li.empty, .panel .hint { color: #6b7681; font-size: 13px; }
      .panel li .rname, .panel li .mname { flex: 1; font-weight: 600; }
      .panel li .meta { color: #8b98a5; font-size: 12px; }
      .panel li.owner .mname { color: #ffd34d; }
      .panel li em { color: #ffd34d; font-size: 12px; font-style: normal; }
      .panel button, .menu.lobby .back { font-size: 14px; padding: 8px 14px; margin: 4px 4px 0 0; }
      .panel button.join { background: #3a8f4a; }
      .panel button.leave, .menu.lobby .back { background: #2a323b; }
      .panel button.start { background: #d63d3d; width: 100%; font-size: 16px; }
      .panel button:disabled { opacity: .5; cursor: not-allowed; }
      .panel form { display: flex; flex-direction: column; gap: 8px; }
      .panel form label { font-size: 13px; color: #c9d1d9; display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .panel form .vis { display: flex; gap: 18px; }
      .panel form .vis label { white-space: nowrap; flex: 0 0 auto; }
      .panel input[type=radio] { accent-color: #d63d3d; width: auto; padding: 0; margin: 0; }
      .panel input[type=text], .panel input:not([type]) { font-size: 15px; padding: 8px 12px; width: 100%; background: #0f151c; color: #e6edf3; border: 1px solid #2d3742; border-radius: 6px; outline: none; }
      .code-form { margin-top: 10px; }
      .code-form input { letter-spacing: 6px; font-size: 20px !important; text-align: center; }
      .menu .code { color: #ffd34d; letter-spacing: 3px; font-size: 18px; }
      .menu.lobby .back { margin-top: 16px; }
      .hud-money { position: absolute; left: 16px; bottom: 92px; background: rgba(12,16,20,.8); border: 2px solid #e6edf3; border-radius: 8px; padding: 4px 12px; font-size: 12px; color: #8b98a5; text-align: center; transition: border-color .2s; }
      .hud-money b { display: block; font-size: 20px; color: #ffd34d; letter-spacing: 1px; }
      .hud-money.up { border-color: #7ed957; transform: scale(1.12); }
      .hud-money { transition: border-color .2s, transform .2s; }
      .money-float { position: absolute; left: 24px; bottom: 140px; font-size: 22px; font-weight: 800; pointer-events: none !important; text-shadow: 0 2px 6px rgba(0,0,0,.8); animation: moneyFloat 1.4s ease-out forwards; }
      .money-float.gain { color: #7ed957; }
      .money-float.loss { color: #ff5a4d; }
      @keyframes moneyFloat { 0% { opacity: 0; transform: translateY(10px) scale(.8); } 15% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: translateY(-60px) scale(1); } }
      .hud-money.down { border-color: #d63d3d; }
      .shop-panel .money-line { color: #8b98a5; font-size: 14px; font-weight: normal; }
      .shop-panel .tabs { display: flex; gap: 6px; margin: 12px 0; }
      .shop-panel .tab { flex: 1; padding: 8px; background: #151b22; color: #8b98a5; border: 1px solid #2d3742; border-radius: 6px; cursor: pointer; font-weight: 700; letter-spacing: 1px; }
      .shop-panel .tab.active { background: #2a323b; color: #ffd34d; border-color: #ffd34d; }
      .shop-panel .tab-body { max-height: 52vh; overflow-y: auto; }
      .shop-panel .money-line b { color: #ffd34d; }
      .shop-panel .sell-row { margin-bottom: 14px; }
      .tower-panel .tower-hp { margin: 12px 0; font-size: 13px; color: #8b98a5; }
      .tower-panel .tower-hp b { color: #4db8ff; }
      .tower-panel .recipes { display: flex; flex-direction: column; gap: 8px; }
      .tower-panel button.battery { background: #3a8f4a; }
      .tower-panel .battery-slots { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; font-size: 13px; color: #8b98a5; }
      .tower-panel .battery-slots b { color: #ffd34d; }
      .tower-panel .battery-slots .cells { display: inline-flex; gap: 4px; }
      .tower-panel .battery-slots .cells i { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: 1px solid #2d3742; border-radius: 4px; background: #151b22; opacity: .35; }
      .tower-panel .battery-slots .cells i.on { opacity: 1; border-color: #ffd34d; background: #2a2a12; box-shadow: 0 0 6px rgba(255,211,77,.5); }
      .tower-panel .battery-slots .status { flex-basis: 100%; font-size: 12px; color: #6b7681; }
      .hud-wave .battery-line { margin-top: 6px; font-size: 12px; color: #8b98a5; display: flex; align-items: center; gap: 6px; }
      .hud-wave .battery-line .cells { display: inline-flex; gap: 3px; }
      .hud-wave .battery-line .cells i { width: 10px; height: 14px; border: 1px solid #3a4550; border-radius: 2px; background: #151b22; }
      .hud-wave .battery-line .cells i.on { background: #ffd34d; border-color: #ffd34d; box-shadow: 0 0 5px rgba(255,211,77,.6); }
      .shop-panel .sell-row button { background: #d6a23d; }
      .shop-panel .lvl { color: #ffd34d; font-size: 12px; }
      .shop-panel .hint { margin-top: 12px; font-size: 12px; color: #6b7681; }
      .death-screen .timer { color: #ffd34d; font-size: 20px; }
      /* virou zumbi: faixa no topo, o resto da tela livre para assistir o zumbi */
      .death-screen.infected { inset: 0 0 auto 0; padding: 18px 24px 16px; background: linear-gradient(rgba(5,12,6,.92), rgba(5,12,6,.75)); border-bottom: 2px solid #7ed957; }
      .death-screen.infected h1 { font-size: 30px; color: #7ed957; margin-bottom: 6px; }
      .death-screen.infected p { margin-bottom: 8px; max-width: 720px; text-align: center; }
      .death-screen.infected .timer { font-size: 16px; }
      .hud-wave { position: absolute; left: 16px; top: 16px; width: 260px; background: rgba(12,16,20,.85); border: 1px solid #2d3742; border-left: 3px solid #ffd34d; border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #c9d1d9; line-height: 1.5; }
      .hud-wave { position: absolute; }
      .hud-wave .mission-toggle { position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border: 1px solid #2d3742; border-radius: 4px; background: #151b22; color: #e6edf3; cursor: pointer; font-size: 14px; line-height: 1; }
      .hud-wave .mission-toggle:hover { background: #2a323b; }
      .hud-wave.collapsed { width: auto; min-width: 150px; padding-right: 38px; }
      .hud-wave.collapsed .mission { display: inline; margin-right: 6px; }
      .hud-wave.collapsed .short { color: #ffd34d; font-weight: 600; }
      .hud-wave .mission { display: block; font-size: 10px; letter-spacing: 2px; color: #8b98a5; text-transform: uppercase; margin-bottom: 2px; }
      .hud-wave b { color: #ffd34d; }
      .hud-wave .boss-label { color: #ff5a4d; font-weight: 800; letter-spacing: 2px; }
